[project]
name = "rti"
version = "0.1.0"
description = "Cloud-only real-time Chinese-English interpreter with professional voice cloning"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "clonebreakman", email = "a1135599372@163.com" }]
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "websockets>=12",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/clonebreakman/realtime-interpreter"
Repository = "https://github.com/clonebreakman/realtime-interpreter"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
